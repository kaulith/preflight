id: v16-removed-s3transfer
title: frappe no longer declares s3transfer
severity: warning
match:
  type: undeclared_import
  paths:
    - s3transfer
  dependencies:
    - boto3
    - s3transfer
message: >
  The app imports s3transfer without declaring it, or boto3, which requires it, in pyproject.toml
  or requirements.txt. On v15 frappe installs boto3 for its S3 backups, and boto3 brings
  s3transfer. v16 moved the backups to the Offsite Backups app and dropped boto3. Since v16.60.0
  s3transfer is back in a new environment only because litellm, which frappe now pins, requires
  boto3. The import works, on a much newer s3transfer than v15's, and it stops working if a later
  litellm drops the requirement.
replacement: >
  Declare s3transfer>=0.10.0,<1 in the app's [project] dependencies, or boto3>=1.34.143,<2 if the
  app uses it as well. Either takes in what frappe v15 installs and what litellm requires on v16.
fix: before
references:
  - https://github.com/frappe/frappe/pull/32351
  - https://github.com/frappe/frappe/blob/486ecf9e4a1daaa0027512bfab2947b8cde1502b/pyproject.toml#L86
  - https://github.com/boto/boto3/blob/1.34.143/setup.py#L16-L20
  - https://github.com/frappe/frappe/blob/2df0425571ebbaed878eabc3edc5b7e7c3327ae0/pyproject.toml#L11-L121
  - https://pypi.org/project/litellm/1.103.2/
