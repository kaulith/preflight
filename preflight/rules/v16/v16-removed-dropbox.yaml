id: v16-removed-dropbox
title: frappe no longer installs the Dropbox SDK
severity: error
match:
  type: undeclared_import
  paths:
    - dropbox
  dependencies:
    - dropbox
message: >
  The app imports dropbox without declaring it in pyproject.toml or requirements.txt. That works on
  v15 because frappe installs the Dropbox SDK itself, for its Dropbox backups. v16 moved the
  backups to the Offsite Backups app and dropped the SDK, so a new v16 environment, like the one
  Frappe Cloud builds or the one bench builds on Python 3.14, does not have it, and the import
  raises ModuleNotFoundError. An environment upgraded in place keeps the package until it is
  rebuilt.
replacement: >
  Declare dropbox in the app's [project] dependencies, in a range that takes in the dropbox~=12.0.2
  frappe v15 pins, so the app installs on both versions.
fix: before
references:
  - https://github.com/frappe/frappe/pull/32351
  - https://github.com/frappe/frappe/blob/486ecf9e4a1daaa0027512bfab2947b8cde1502b/pyproject.toml#L87
  - https://github.com/frappe/frappe/blob/v16.53.0/pyproject.toml#L10-L106
