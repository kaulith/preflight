message: >
  The app's pyproject.toml pins a package that frappe 16.53.0 also pins, and no version satisfies
  both. bench installs each app with pip or uv into the env that holds frappe, and neither refuses
  the clash: the later install replaces the version the earlier one put in (pip prints a dependency
  conflict, uv only lists the swap) and exits 0, so frappe or the app ends up on a version outside
  its own pin. The app stays on this branch through the upgrade, so the pin goes with it.
replacement: >
  Widen the pin in the app's [project] dependencies to take in frappe's, which the finding shows,
  and test the app with it.
fix: before
references:
  - https://github.com/frappe/frappe/blob/e8d41dd0061a32ee781caefe5d0b0d2bb7c15362/pyproject.toml#L10-L106
  - https://github.com/frappe/bench/blob/4f56e02d4a07368bb241f48b1aa69d21498984ae/bench/app.py#L935-L950
