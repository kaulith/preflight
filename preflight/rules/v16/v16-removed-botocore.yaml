id: v16-removed-botocore
title: frappe no longer declares botocore
severity: warning
match:
  type: undeclared_import
  paths:
    - botocore
  dependencies:
    - boto3
    - botocore
message: >
  The app imports botocore without declaring it, or boto3, which requires it, in pyproject.toml or
  requirements.txt. On v15 frappe installs boto3 for its S3 backups, and boto3 brings botocore. v16
  moved the backups to the Offsite Backups app and dropped boto3. Since v16.60.0 botocore is back
  in a new environment only because litellm, which frappe now pins, requires boto3. The import
  works, on a much newer botocore than v15's, and it stops working if a later litellm drops the
  requirement.
replacement: >
  Declare botocore>=1.34.143,<2 in the app's [project] dependencies, or boto3>=1.34.143,<2 if the
  app uses it as well. Either takes in what frappe v15 installs and what litellm requires on v16.
fix: before
references:
  - https://github.com/frappe/frappe/pull/32351
  - https://github.com/frappe/frappe/blob/486ecf9e4a1daaa0027512bfab2947b8cde1502b/pyproject.toml#L86
  - https://github.com/boto/boto3/blob/1.34.143/setup.py#L16-L20
  - https://github.com/frappe/frappe/blob/2df0425571ebbaed878eabc3edc5b7e7c3327ae0/pyproject.toml#L11-L121
  - https://pypi.org/project/litellm/1.103.2/
