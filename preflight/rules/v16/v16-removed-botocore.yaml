id: v16-removed-botocore
title: frappe no longer installs botocore
severity: error
match:
  type: undeclared_import
  paths:
    - botocore
  dependencies:
    - boto3
    - botocore
message: >
  The app imports botocore without declaring it, or boto3, which requires it, in pyproject.toml or
  requirements.txt. That works on v15 because frappe installs boto3 for its S3 backups, and boto3
  brings botocore. v16 moved the backups to the Offsite Backups app and dropped boto3, so a new v16
  environment, like the one Frappe Cloud builds or the one bench builds on Python 3.14, does not
  have botocore, and the import raises ModuleNotFoundError. An environment upgraded in place keeps
  the package until it is rebuilt.
replacement: >
  Declare botocore in the app's [project] dependencies, or boto3 if the app uses it as well, in a
  range that takes in the botocore 1.34 that the boto3~=1.34.143 frappe v15 pins requires, so the
  app installs on both versions.
fix: before
references:
  - https://github.com/frappe/frappe/pull/32351
  - https://github.com/frappe/frappe/blob/486ecf9e4a1daaa0027512bfab2947b8cde1502b/pyproject.toml#L86
  - https://github.com/boto/boto3/blob/1.34.143/setup.py#L16-L20
  - https://github.com/frappe/frappe/blob/v16.53.0/pyproject.toml#L10-L106
