id: v16-removed-boto3
title: frappe no longer declares boto3
severity: warning
match:
  type: undeclared_import
  paths:
    - boto3
  dependencies:
    - boto3
message: >
  The app imports boto3 without declaring it in pyproject.toml or requirements.txt. On v15 frappe
  installs boto3 itself, for its S3 backups. v16 moved the backups to the Offsite Backups app and
  dropped boto3. Since v16.60.0 it is back in a new environment only because litellm, which frappe
  now pins, requires it, at 1.43.1 or later. The import works, on a boto3 ten minor versions newer
  than v15's, and it stops working if a later litellm drops the requirement.
replacement: >
  Declare boto3 in the app's [project] dependencies as boto3>=1.34.143,<2, which takes in both the
  boto3~=1.34.143 frappe v15 pins and the range litellm requires on v16. A pin that stops at 1.34
  makes the v16 install unsatisfiable.
fix: before
references:
  - https://github.com/frappe/frappe/pull/32351
  - https://github.com/frappe/frappe/blob/486ecf9e4a1daaa0027512bfab2947b8cde1502b/pyproject.toml#L86
  - https://github.com/frappe/frappe/blob/2df0425571ebbaed878eabc3edc5b7e7c3327ae0/pyproject.toml#L11-L121
  - https://pypi.org/project/litellm/1.103.2/
