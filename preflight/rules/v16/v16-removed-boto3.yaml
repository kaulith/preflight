id: v16-removed-boto3
title: frappe no longer installs boto3
severity: error
match:
  type: undeclared_import
  paths:
    - boto3
  dependencies:
    - boto3
message: >
  The app imports boto3 without declaring it in pyproject.toml or requirements.txt. That works on
  v15 because frappe installs boto3 itself, for its S3 backups. v16 moved the backups to the
  Offsite Backups app and dropped boto3, so a new v16 environment, like the one Frappe Cloud builds
  or the one bench builds on Python 3.14, does not have it, and the import raises
  ModuleNotFoundError. An environment upgraded in place keeps the package until it is rebuilt.
replacement: >
  Declare boto3 in the app's [project] dependencies, in a range that takes in the boto3~=1.34.143
  frappe v15 pins, so the app installs on both versions.
fix: before
references:
  - https://github.com/frappe/frappe/pull/32351
  - https://github.com/frappe/frappe/blob/486ecf9e4a1daaa0027512bfab2947b8cde1502b/pyproject.toml#L86
  - https://github.com/frappe/frappe/blob/v16.53.0/pyproject.toml#L10-L106
