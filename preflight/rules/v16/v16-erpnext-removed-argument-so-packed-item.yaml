id: v16-erpnext-removed-argument-so-packed-item
title: ERPNext's update_packed_item_with_pick_list_info no longer takes so_packed_item
severity: error
match:
  type: call
  paths:
    - erpnext.stock.doctype.packed_item.packed_item.update_packed_item_with_pick_list_info
  with_kwargs:
    - so_packed_item
message: >
  The call passes so_packed_item by name, so it raises TypeError. On v16:
  update_packed_item_with_pick_list_info(main_item_row, pi_row, location), was (main_item_row, pi_row, so_packed_item).
replacement: >
  Update the call to the v16 arguments, and check what each one now expects.
fix: with-upgrade
references:
  - https://github.com/frappe/erpnext/blob/v15.125.0/erpnext/stock/doctype/packed_item/packed_item.py#L350
  - https://github.com/frappe/erpnext/blob/886ab6ae187244e7f1b852393384ab6019d56264/erpnext/stock/doctype/packed_item/packed_item.py#L636
