id: v16-app-required-apps
title: An app it requires is not on the bench
severity: error
match:
  type: required_apps
message: >
  The app lists an app in required_apps that this bench does not hold. Installing the app installs
  its required apps first, and stops with "App ... not in apps.txt" when one is missing.
replacement: >
  Get the required app onto the bench with bench get-app, on the branch for the frappe the bench
  runs now, so the upgrade switches it to v16 with the other apps.
fix: before
references:
  - https://github.com/frappe/frappe/blob/v16.53.0/frappe/installer.py#L308
