id: v16-erpnext-removed-argument-sre-name
title: ERPNext's get_serial_batch_entries_for_voucher no longer takes sre_name
severity: error
match:
  type: call
  paths:
    - erpnext.stock.doctype.stock_reservation_entry.stock_reservation_entry.get_serial_batch_entries_for_voucher
  with_kwargs:
    - sre_name
message: >
  The call passes sre_name by name, so it raises TypeError. On v16:
  get_serial_batch_entries_for_voucher(sre_names), was (sre_name).
replacement: >
  Update the call to the v16 arguments, and check what each one now expects.
fix: with-upgrade
references:
  - https://github.com/frappe/erpnext/blob/v15.125.0/erpnext/stock/doctype/stock_reservation_entry/stock_reservation_entry.py#L875
  - https://github.com/frappe/erpnext/blob/886ab6ae187244e7f1b852393384ab6019d56264/erpnext/stock/doctype/stock_reservation_entry/stock_reservation_entry.py#L1203
