id: v17-deprecated-tests-system-settings
title: The system settings test helpers are marked for removal in v17
severity: warning
match:
  type: import_path
  paths:
    - frappe.tests.get_system_setting
    - frappe.tests.update_system_settings
message: >
  frappe.tests.get_system_setting and frappe.tests.update_system_settings are deprecated and their
  dumpster entries name v17 as the removal. They are still present on develop (checked
  2026-10-25), so they keep working with a deprecation warning; the import fails once the removal
  lands.
replacement: >
  Read the value with frappe.db.get_single_value("System Settings", key), and set it inside the
  self.change_settings(...) context manager.
references:
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/deprecation_dumpster.py#L480-L498
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/tests/__init__.py#L8-L13
