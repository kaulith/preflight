id: v17-app-requires-python
title: App's requires-python rules out the Python v17 runs on
severity: error
match:
  type: requires_python
  python: ">=3.14,<3.15"
message: >
  Frappe develop, which becomes v17, runs on Python >=3.14,<3.15 (checked 2026-10-24) and the
  app's requires-python allows none of it, so pip will not install the app on a v17 bench. The app
  stays on this branch through the upgrade, so this pyproject.toml is the one that gets installed.
replacement: >
  Widen requires-python in the app's pyproject.toml to take in Python 3.14, and test the app on it.
references:
  - https://github.com/frappe/frappe/blob/191a3e266411b367ac0def129d269671b52f7815/pyproject.toml
