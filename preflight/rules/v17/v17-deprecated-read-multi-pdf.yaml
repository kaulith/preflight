id: v17-deprecated-read-multi-pdf
title: read_multi_pdf is marked for removal in v17
severity: warning
match:
  type: import_path
  paths:
    - frappe.utils.print_format.read_multi_pdf
message: >
  read_multi_pdf is deprecated and its dumpster entry names v17 as the removal. It is still
  present on develop (checked 2026-10-25), so it keeps working with a deprecation warning; the
  import fails once the removal lands.
replacement: >
  Write the PdfWriter output into a BytesIO buffer and read its value.
references:
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/deprecation_dumpster.py#L294
