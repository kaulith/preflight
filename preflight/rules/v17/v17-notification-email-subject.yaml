id: v17-notification-email-subject
title: An Email notification with no subject or template can no longer be saved
severity: error
match:
  type: site_record
  doctypes:
    - Notification
  filters:
    channel: Email
    is_standard: 0
    subject: ""
    email_template: ""
message: >
  frappe develop, which becomes v17, refuses to save an Email notification with neither a Subject
  nor an Email Template. It keeps sending after the upgrade, but its next save raises
  MandatoryError. If an app ships it as a fixture, bench migrate and app install stop on it.
replacement: >
  Fill in Subject or pick an Email Template, here and in the app's fixture if it ships one. v17
  also requires a row under Recipients unless Send To All Assignees is on, so check that too.
fix: before
references:
  - https://github.com/frappe/frappe/pull/46534
  - https://github.com/frappe/frappe/blob/2746cacf9115bec32a06a894d9f69c92457667c0/frappe/email/doctype/notification/notification.py#L185-L191
  - https://github.com/frappe/frappe/blob/2746cacf9115bec32a06a894d9f69c92457667c0/frappe/email/doctype/notification/notification.py#L226-L230
  - https://github.com/frappe/frappe/blob/v16.60.2/frappe/email/doctype/notification/notification.py#L155-L190
