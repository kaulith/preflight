id: v17-deprecated-make-esc
title: frappe.utils.make_esc is marked for removal in v17
severity: warning
match:
  type: import_path
  paths:
    - frappe.utils.make_esc
message: >
  make_esc is deprecated ("Not used anymore") and its dumpster entry names v17 as the removal. It
  is still present on develop (checked 2026-10-25), so it keeps working with a deprecation
  warning; the import fails once the removal lands.
replacement: >
  Escape the characters in your own code.
references:
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/deprecation_dumpster.py#L228
