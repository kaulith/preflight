id: v17-moved-max-password-size
title: MAX_PASSWORD_SIZE is gone from the user controller
severity: error
match:
  type: import_path
  paths:
    - frappe.core.doctype.user.user.MAX_PASSWORD_SIZE
message: >
  The password length limit moved to frappe.utils.password in v17, next to validate_password_size,
  which now enforces it. frappe.auth still exposes it, but the user controller no longer imports
  it, so importing it from there raises ImportError after the upgrade.
replacement: >
  Import MAX_PASSWORD_SIZE from frappe.auth, which has it on both v16 and v17.
fix: before
references:
  - https://github.com/frappe/frappe/pull/44376
  - https://github.com/frappe/frappe/commit/9b0cefb5650a48437cb2a72c7aa5f41632b662a2
  - https://github.com/frappe/frappe/blob/2746cacf9115bec32a06a894d9f69c92457667c0/frappe/auth.py#L30-L35
  - https://github.com/frappe/frappe/blob/2746cacf9115bec32a06a894d9f69c92457667c0/frappe/utils/password.py#L17-L34
