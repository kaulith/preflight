id: v17-moved-max-password-size
title: MAX_PASSWORD_SIZE moved to frappe.utils.password
severity: error
match:
  type: import_path
  paths:
    - frappe.auth.MAX_PASSWORD_SIZE
    - frappe.core.doctype.user.user.MAX_PASSWORD_SIZE
message: >
  The password length limit moved from frappe.auth to frappe.utils.password in v17, next to
  validate_password_size, which now enforces it. Importing it from frappe.auth, or from the user
  controller that imported it from there, raises ImportError after the upgrade.
replacement: >
  Import MAX_PASSWORD_SIZE from frappe.utils.password on the app's v17 branch; v16 has it only in
  frappe.auth.
references:
  - https://github.com/frappe/frappe/pull/44376
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/utils/password.py#L17-L34
