id: v17-deprecated-verify-password
title: The verify_password endpoint is marked for removal in v17
severity: warning
match:
  type: string_contains
  paths:
    - frappe.core.doctype.user.user.verify_password
message: >
  frappe.core.doctype.user.user.verify_password is deprecated and marked for removal in v17: it
  only gated the screen, while the method behind it could still be called directly. It is still
  present on develop (checked 2026-10-25), so it keeps working with a deprecation warning; the
  endpoint stops answering once the removal lands.
replacement: >
  Ask the user with frappe.confirm_sensitive_action on the client, and check permissions in the
  whitelisted method that does the work.
references:
  - https://github.com/frappe/frappe/pull/43611
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/core/doctype/user/user.py#L1268-L1277
