id: v17-deprecated-is-column-missing
title: frappe.db.is_column_missing is marked for removal in v17
severity: warning
match:
  type: import_path
  paths:
    - frappe.db.is_column_missing
message: >
  The old name for frappe.db.is_missing_column is a shim whose dumpster entry names v17 as the
  removal. It is still present on develop (checked 2026-10-25), so it keeps working with a
  deprecation warning; the attribute goes once the removal lands.
replacement: >
  Use frappe.db.is_missing_column.
references:
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/deprecation_dumpster.py#L236
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/database/database.py#L1503-L1505
