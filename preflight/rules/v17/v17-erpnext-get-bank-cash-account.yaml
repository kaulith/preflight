id: v17-erpnext-get-bank-cash-account
title: ERPNext sales_invoice.get_bank_cash_account checks the user's permission on v17
severity: warning
match:
  type: call
  paths:
    - erpnext.accounts.doctype.sales_invoice.sales_invoice.get_bank_cash_account
message: >
  On ERPNext v17 this function needs select on the Company and on the Mode of Payment. The check
  is inside the function, so a call from an app's Python runs it too, and a logged-in user without
  them gets a PermissionError. By default a user whose roles are only among Employee, Stock User,
  Projects User, Auditor, Desk User and System Manager has no access to Mode of Payment. Code
  running as Administrator passes.
replacement: >
  In server code that does not act on the user's behalf, read the account with
  frappe.db.get_value("Mode of Payment Account", {"parent": mode_of_payment, "company": company},
  "default_account"), and throw when it is empty. This works on v16 too.
fix: before
references:
  - https://github.com/frappe/erpnext/pull/68371
  - https://github.com/frappe/erpnext/blob/feefe15ca5b57c2601d57a673720f4196bd9ec2e/erpnext/accounts/doctype/sales_invoice/sales_invoice.py#L1373
  - https://github.com/frappe/erpnext/blob/v16.60.0/erpnext/accounts/doctype/sales_invoice/sales_invoice.py#L2869
