id: v17-deprecated-client-get-js
title: The frappe.client.get_js endpoint is marked for removal in v17
severity: warning
match:
  type: string_contains
  paths:
    - frappe.client.get_js
message: >
  frappe.client.get_js is deprecated and its dumpster entry names v17 as the removal. It is still
  present on develop (checked 2026-10-25), so it keeps working with a deprecation warning; the
  endpoint stops answering once the removal lands.
replacement: >
  Ship the file as an app asset and load it with frappe.require.
references:
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/deprecation_dumpster.py#L261
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/client.py#L362-L364
