id: v17-deprecated-frappe-test-case
title: FrappeTestCase is marked for removal in v17
severity: warning
match:
  type: import_path
  paths:
    - frappe.tests.utils.FrappeTestCase
message: >
  FrappeTestCase is a compatibility shim and its dumpster entry names v17 as the removal. It is
  still present on develop (checked 2026-10-25), so it keeps working with a deprecation warning; a
  suite built on it fails at import once the removal lands, and no test in the file runs.
replacement: >
  Subclass frappe.tests.UnitTestCase or frappe.tests.IntegrationTestCase, depending on whether
  the test needs a database.
references:
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/deprecation_dumpster.py#L603
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/tests/utils/__init__.py#L93
