id: v17-bench-python
title: The bench runs a Python v17 cannot install on
severity: error
match:
  type: bench_python
  python: ">=3.14,<3.15"
message: >
  Frappe develop, which becomes v17, requires Python >=3.14,<3.15 (checked 2026-10-24), and the
  bench environment runs a Python outside that range, so pip will not install it.
replacement: >
  Rebuild the environment on Python 3.14 before switching to v17: bench setup env --python python3.14.
references:
  - https://github.com/frappe/frappe/blob/191a3e266411b367ac0def129d269671b52f7815/pyproject.toml
