id: v17-deprecated-tests-utils-helpers
title: The test helpers on frappe.tests.utils are marked for removal in v17
severity: warning
match:
  type: import_path
  paths:
    - frappe.tests.utils.change_settings
    - frappe.tests.utils.patch_hooks
    - frappe.tests.utils.debug_on
    - frappe.tests.utils.timeout
    - frappe.tests.utils.get_dependencies
message: >
  frappe.tests.utils re-exports these from the deprecation dumpster, whose entries name v17 as the
  removal. They are still present on develop (checked 2026-10-25), so they keep working with a
  deprecation warning; the import fails once the removal lands, and no test in the file runs.
replacement: >
  Import change_settings, patch_hooks, debug_on and timeout from frappe.tests, or use the
  matching helper on the test case; get_dependencies becomes
  frappe.tests.utils.get_missing_records_doctypes.
references:
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/deprecation_dumpster.py#L510-L546
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/deprecation_dumpster.py#L895
  - https://github.com/frappe/frappe/blob/c4e97234b4a9556dbebe7db76cbcfd48bfac8355/frappe/tests/utils/__init__.py#L83-L103
